name: "Bug Report"
description: "Something is broken."
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "What went wrong, and what did you expect instead?"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "How to reproduce"
      description: "The commands you ran and their output."
      placeholder: |
        ```sh
        $ task test
        ...error output...
        ```
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "Environment"
      description: "Output of `go version`, plus OS if relevant."
      placeholder: "go1.27.0 darwin/arm64"
